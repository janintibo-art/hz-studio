name: HZ Studio V13 - Android Capture et Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name hz_studio .
      - name: Install Android native audio decoder
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/hz_studio
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/example/hz_studio/MainActivity.kt
          cp android_native/AndroidLiveCaptureService.kt android/app/src/main/kotlin/com/example/hz_studio/AndroidLiveCaptureService.kt
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          perms = '\n'.join(f'    <uses-permission android:name="{p}" />' for p in (
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION',
              'android.permission.RECORD_AUDIO',
          ))
          xml = xml.replace('<application', perms + '\n    <application', 1)
          xml = xml.replace('</application>', '    <service android:name=".AndroidLiveCaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>', 1)
          manifest.write_text(xml)
          PYMANIFEST
      - name: Set Android app compile SDK 36
        run: |
          grep -q 'compileSdk = flutter.compileSdkVersion' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
      - run: flutter pub get
      - name: Fix file_picker plugin compile SDK 36
        shell: bash
        run: |
          plugin_gradle=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 3 -path '*/file_picker-*/android/build.gradle' -print -quit)
          if [ -z "$plugin_gradle" ]; then echo 'file_picker Android Gradle file not found'; exit 1; fi
          sed -i -E 's/compileSdk[[:space:]]+34/compileSdk 36/' "$plugin_gradle"
          grep -Eq 'compileSdk[[:space:]]+36' "$plugin_gradle" || { echo 'compileSdk 36 not set'; exit 1; }
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk hz_studio_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hz-studio-android
          path: hz_studio_android.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform
        run: flutter create --platforms=windows --project-name hz_studio .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - name: Download portable FFmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg-portable.zip
          Expand-Archive -Path ffmpeg-portable.zip -DestinationPath ffmpeg-portable
          $ffmpeg = Get-ChildItem -Path ffmpeg-portable -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg) { throw 'ffmpeg.exe not found in the portable distribution' }
          Copy-Item $ffmpeg.FullName 'build/windows/x64/runner/Release/ffmpeg.exe'
          $license = Get-ChildItem -Path ffmpeg-portable -Filter LICENSE -Recurse | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName 'build/windows/x64/runner/Release/FFMPEG-LICENSE.txt' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Windows Live Audio companion
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy soundcard sounddevice pedalboard
          python -m PyInstaller --onefile --name hz_live_bridge --collect-all pedalboard --collect-all soundcard windows_live/live_bridge.py
          Copy-Item 'dist/hz_live_bridge.exe' 'build/windows/x64/runner/Release/hz_live_bridge.exe'
      - name: Package EXE and dependencies
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'hz_studio_windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hz-studio-windows
          path: hz_studio_windows.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hz-studio-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/hz_studio_android.apk dist/hz_studio_windows.zip --title "HZ Studio ${GITHUB_REF_NAME}" --notes "Android et Windows. V12: prototype Windows Live Audio (sortie distincte obligatoire). V13 Android : diagnostic de capture des applications compatibles, sans traitement audio en direct." --latest
