name: HZ Studio - APK Windows et Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name hz_studio .
      - name: Set Android app compile SDK 36
        run: |
          grep -q 'compileSdk = flutter.compileSdkVersion' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
      - run: flutter pub get
      - name: Fix file_picker plugin compile SDK 36
        shell: bash
        run: |
          plugin_gradle=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 3 -path '*/file_picker-*/android/build.gradle' -print -quit)
          if [ -z "$plugin_gradle" ]; then echo 'file_picker Android Gradle file not found'; exit 1; fi
          echo "Patching: $plugin_gradle"
          grep -n 'compileSdk' "$plugin_gradle"
          sed -i -E 's/compileSdk[[:space:]]+34/compileSdk 36/' "$plugin_gradle"
          grep -Eq 'compileSdk[[:space:]]+36' "$plugin_gradle" || { echo 'compileSdk 36 not set'; exit 1; }
          grep -n 'compileSdk' "$plugin_gradle"
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk hz_studio_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hz-studio-android
          path: hz_studio_android.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform
        run: flutter create --platforms=windows --project-name hz_studio .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - name: Package EXE and dependencies
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'hz_studio_windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hz-studio-windows
          path: hz_studio_windows.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hz-studio-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/hz_studio_android.apk dist/hz_studio_windows.zip --title "HZ Studio ${GITHUB_REF_NAME}" --notes "Android APK et Windows EXE (dans le ZIP avec ses DLL). Generateur de frequences et lecteur WAV experimental." --latest
